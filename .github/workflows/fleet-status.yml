# Watches the CI of every repository in the fork and makes a red one impossible to miss.
#
# The forks build nightly on a `schedule`. A scheduled run that fails is the quietest
# kind of failure there is: no pull request turns red, no push is blocked, and the
# notification lands in a mailbox next to forty-six green ones. `opendxl-siem-sensor`
# sat red for five nights with a rustls advisory while the documentation said "all
# green". More checks would not have caught that - somebody reading the result would.
#
# So this runs after the nightly builds have finished, and when anything is not green
# it opens an issue in this repository (and comments on it each following day, so the
# issue shows how long it has been broken). When everything is green again it closes
# the issue. The job itself also fails, which is what reaches the mailbox.

name: Fleet status

on:
  schedule:
    # The forks build between 02:00 and 03:10 UTC; this reads the results afterwards.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fleet:
    name: every repository in the fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Collect
        id: collect
        run: |
          set -o pipefail
          python tools/fleet_status.py --json fleet.json | tee fleet.txt && rc=0 || rc=$?
          echo "broken=$rc" >> "$GITHUB_OUTPUT"
          {
            echo '## Fleet status'
            echo
            echo '```'
            cat fleet.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Open or update the issue
        if: steps.collect.outputs.broken != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Fleet status: a repository is not green'
        run: |
          set -eu
          gh label create fleet-status --color B60205 \
            --description 'Automatic: CI of a repository in the fork is not green' 2>/dev/null || true
          number=$(gh issue list --label fleet-status --state open --limit 1 --json number --jq '.[0].number // empty')
          body=$(printf '%s\n\n```\n%s\n```\n\n[Run](%s/%s/actions/runs/%s)\n' \
                 'Checked by `tools/fleet_status.py`.' "$(cat fleet.txt)" \
                 "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --label fleet-status --body "$body"
          fi

      - name: Close the issue when everything is green again
        if: steps.collect.outputs.broken == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          number=$(gh issue list --label fleet-status --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            body=$(printf '%s\n\n```\n%s\n```\n' \
                   'Everything is green again.' "$(cat fleet.txt)")
            gh issue close "$number" --comment "$body"
          fi

      # Last, so the summary and the issue exist even when this fails the run.
      - name: Fail if a repository is not green
        if: steps.collect.outputs.broken != '0'
        run: |
          echo "::error::at least one repository in the fork is not green - see the job summary"
          exit 1
